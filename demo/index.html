<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-pixel-pet · 预览</title>
<style>
  :root {
    --dsw-specific-tip: rgba(16, 20, 24, 0.85);
    --dsw-alias-border-l2: rgba(255, 255, 255, 0.14);
    --dsw-alias-label-primary: #e8ecf4;
    --dsw-alias-label-tertiary: #8b93a7;
    --dsw-alias-state-error-primary: #f7597c;
    --dsw-font-family: ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1000px 600px at 80% -10%, rgba(77, 124, 254, 0.18), transparent 60%),
                radial-gradient(800px 500px at -10% 110%, rgba(35, 201, 176, 0.12), transparent 55%),
                linear-gradient(180deg, #0b1120 0%, #0e1526 100%);
    color: var(--dsw-alias-label-primary);
    font-family: var(--dsw-font-family);
  }
  .panel {
    position: fixed;
    left: 24px;
    top: 24px;
    width: 320px;
    padding: 18px 20px;
    border-radius: 16px;
    background: var(--dsw-specific-tip);
    border: 1px solid var(--dsw-alias-border-l2);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  .panel h1 { margin: 0 0 4px; font-size: 15px; }
  .panel p.sub { margin: 0 0 16px; font-size: 12px; color: var(--dsw-alias-label-tertiary); line-height: 18px; }
  .group { margin-bottom: 14px; }
  .group > .label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dsw-alias-label-tertiary); margin-bottom: 6px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button {
    flex: 1;
    min-width: 44px;
    padding: 6px 0;
    border-radius: 10px;
    border: 1px solid var(--dsw-alias-border-l2);
    background: rgba(255, 255, 255, 0.05);
    color: var(--dsw-alias-label-primary);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background 120ms, border-color 120ms;
  }
  .seg button:hover { background: rgba(255, 255, 255, 0.12); }
  .seg button.active { border-color: var(--accent, #4d7cfe); background: rgba(77, 124, 254, 0.22); }
  .seg button.auto { flex-basis: 100%; }
  .notice { margin-top: 12px; font-size: 11px; color: var(--dsw-alias-label-tertiary); line-height: 17px; }
  .notice code { color: var(--dsw-alias-label-primary); }

  /* ------- pet widget (same styles as lib/client.pet.js) ------- */
  .dshpet {
    position: fixed; z-index: 2147483000;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .dshpet[data-dragging="true"] { cursor: grabbing !important; }
  .dshpet_stage { position: relative; display: flex; flex-direction: column; align-items: center; cursor: grab; }
  .dshpet_card {
    position: relative; width: 128px; height: 128px; border-radius: 22px;
    background: var(--dsw-specific-tip); border: 1px solid var(--dsw-alias-border-l2);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.30);
    display: grid; place-items: center; overflow: visible;
    transition: transform 140ms ease-out, border-color 200ms ease;
  }
  .dshpet_card:hover { transform: translateY(-2px) scale(1.02); }
  .dshpet_card[data-level-bump="true"] { animation: dshpet_pop 320ms ease-out; }
  @keyframes dshpet_pop { 0% { transform: scale(0.86); } 55% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .dshpet_gif {
    width: 118px; height: 118px; object-fit: contain;
    image-rendering: pixelated; image-rendering: crisp-edges;
    animation: dshpet_bob 3.2s ease-in-out infinite;
  }
  .dshpet[data-state="rest"] .dshpet_gif, .dshpet[data-state="done"] .dshpet_gif, .dshpet[data-state="work"] .dshpet_gif { animation: none; }
  @keyframes dshpet_bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .dshpet_badge {
    position: absolute; top: -8px; left: -8px; min-width: 34px; height: 22px; padding: 0 7px;
    border-radius: 999px; background: #101418; border: 2px solid var(--dshpet-accent, #4d7cfe);
    color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
    letter-spacing: 0.04em; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
  }
  .dshpet_dot {
    position: absolute; top: -7px; right: -7px; width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid #101418; background: var(--dshpet-state-color, #8b93a7);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  }
  .dshpet_dot[data-active="true"] { animation: dshpet_pulse 1.6s ease-in-out infinite; }
  @keyframes dshpet_pulse {
    0%, 100% { box-shadow: 0 2px 6px rgba(0,0,0,.35), 0 0 0 0 var(--dshpet-state-color); }
    50% { box-shadow: 0 2px 6px rgba(0,0,0,.35), 0 0 0 6px transparent; }
  }
  .dshpet_shadow {
    width: 76px; height: 14px; margin-top: -4px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.38) 0%, transparent 70%);
    animation: dshpet_shadow 3.2s ease-in-out infinite;
  }
  .dshpet[data-state="rest"] .dshpet_shadow, .dshpet[data-state="done"] .dshpet_shadow, .dshpet[data-state="work"] .dshpet_shadow { animation: none; }
  @keyframes dshpet_shadow {
    0%, 100% { transform: scaleX(1); opacity: 1; }
    50% { transform: scaleX(0.82); opacity: 0.65; }
  }
  .dshpet_chip {
    display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px;
    border-radius: 999px; background: var(--dsw-specific-tip);
    border: 1px solid var(--dsw-alias-border-l2); color: var(--dsw-alias-label-primary);
    font-size: 12px; font-weight: 600; line-height: 24px; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
  }
  .dshpet_chip_ind { width: 8px; height: 8px; border-radius: 50%; background: var(--dshpet-state-color, #8b93a7); }
  .dshpet_bubble {
    position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%);
    max-width: 160px; padding: 7px 11px; border-radius: 12px;
    background: var(--dsw-specific-tip); border: 1px solid var(--dsw-alias-border-l2);
    color: var(--dsw-alias-label-primary); font-size: 12px; font-weight: 600;
    line-height: 17px; text-align: center; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.32); pointer-events: none;
    animation: dshpet_bubble_in 180ms ease-out;
  }
  .dshpet_bubble::after {
    content: ""; position: absolute; top: 100%; left: 50%; margin-left: -6px;
    border: 6px solid transparent; border-top-color: var(--dsw-specific-tip);
  }
  @keyframes dshpet_bubble_in {
    from { opacity: 0; transform: translateX(-50%) translateY(6px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
</style>
</head>
<body>
  <div class="panel">
    <h1>dsh-pixel-pet · 预览</h1>
    <p class="sub">在 DSH 中：角色档位跟随性能滑杆（Lv.1–6），动作状态跟随对话执行状态。这里可以手动模拟两种输入。</p>
    <div class="group">
      <div class="label">性能等级 → GIF 数字</div>
      <div class="seg" id="levels"></div>
    </div>
    <div class="group">
      <div class="label">动作状态</div>
      <div class="seg" id="states"></div>
      <div class="seg" style="margin-top:6px">
        <button id="auto" class="auto">模拟对话执行：待机 → 工作 → 等待 → 工作 → 完成</button>
      </div>
    </div>
    <div class="notice">提示：真实 DSH 环境里，<code>localStorage["dsh-performance-slider.level.v1"]</code> 与 <code>body[data-dsh-performance-level]</code> 驱动档位；会话快照的 <code>running / pending / blank</code> 驱动动作状态。本页用按钮模拟。</div>
  </div>

  <div class="dshpet" id="pet" data-state="idle" data-level="1">
    <div class="dshpet_stage">
      <div class="dshpet_bubble" id="bubble" hidden></div>
      <div class="dshpet_card" id="card" data-level-bump="true" style="--dshpet-accent:#4d7cfe">
        <img class="dshpet_gif" id="gif" alt="pet" draggable="false">
        <span class="dshpet_badge" id="badge" style="--dshpet-accent:#4d7cfe">Lv.1</span>
        <span class="dshpet_dot" id="dot" style="--dshpet-state-color:#23c9b0"></span>
      </div>
      <div class="dshpet_shadow"></div>
    </div>
    <div class="dshpet_chip" id="chip" style="--dshpet-state-color:#23c9b0">
      <span class="dshpet_chip_ind"></span><span id="chipText">待机</span>
    </div>
  </div>

<script>
  const TIERS = [
    { name: '瘦白领', color: '#4d7cfe' },
    { name: '清秀西装', color: '#23c9b0' },
    { name: '型男西装', color: '#9673f6' },
    { name: '中山装', color: '#2ec98b' },
    { name: '怒目武者', color: '#f5a524' },
    { name: '冕冠帝王', color: '#f7597c' },
  ];
  const STATES = ['idle', 'rest', 'work', 'done', 'wait'];
  const STATE_LABELS = { idle: '待机', rest: '休息', work: '工作', done: '完成', wait: '等待' };
  const BUBBLES = { work: '干活中…', wait: '等你呢…', done: '搞定！', rest: '歇会儿', idle: '待命中' };
  const STATE_COLORS = { work: '#4ade80', wait: '#f5a524', done: '#4d7cfe', rest: '#8b93a7', idle: '#23c9b0' };
  const GIF_BASE = '../assets/gifs';

  let level = 0;
  let state = 'idle';
  let bubbleTimer = null;

  const pet = document.getElementById('pet');
  let cardEl = document.getElementById('card');
  const gif = document.getElementById('gif');
  const badge = document.getElementById('badge');
  const dot = document.getElementById('dot');
  const bubble = document.getElementById('bubble');
  const chipText = document.getElementById('chipText');
  const chip = document.getElementById('chip');

  function render() {
    const tier = TIERS[level];
    const gifUrl = `${GIF_BASE}/${String(level + 1).padStart(2, '0')}_${state}.gif`;
    gif.src = gifUrl;
    badge.textContent = `Lv.${level + 1}`;
    badge.style.setProperty('--dshpet-accent', tier.color);
    cardEl.style.setProperty('--dshpet-accent', tier.color);
    chip.style.setProperty('--dshpet-state-color', STATE_COLORS[state]);
    dot.style.setProperty('--dshpet-state-color', STATE_COLORS[state]);
    dot.dataset.active = (state === 'work' || state === 'wait') ? 'true' : '';
    pet.dataset.state = state;
    pet.dataset.level = String(level + 1);
    chipText.textContent = STATE_LABELS[state];
  }

  function showBubble(text) {
    clearTimeout(bubbleTimer);
    bubble.textContent = text;
    bubble.hidden = false;
    bubbleTimer = setTimeout(() => { bubble.hidden = true; }, 2600);
  }

  function setState(next, bubbleText) {
    if (state === next) return;
    state = next;
    // re-trigger pop on the card
    const clone = cardEl.cloneNode(true);
    cardEl.replaceWith(clone);
    cardEl = clone;
    render();
    if (bubbleText) showBubble(bubbleText);
  }

  // ---- draggable pet (same behavior as the DSH plugin) ----
  const POSITION_KEY = 'dsh-pixel-pet.position.v1';
  let drag = null;
  let suppressClick = false;
  try {
    const raw = localStorage.getItem(POSITION_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (typeof p.x === 'number' && typeof p.y === 'number') {
        pet.style.left = p.x + 'px';
        pet.style.top = p.y + 'px';
      }
    }
  } catch { /* ignore */ }
  if (!pet.style.left) {
    pet.style.left = (window.innerWidth - pet.offsetWidth - 22) + 'px';
    pet.style.top = (window.innerHeight - pet.offsetHeight - 26) + 'px';
  }

  pet.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    drag = { startX: e.clientX, startY: e.clientY, origLeft: pet.offsetLeft, origTop: pet.offsetTop, moved: false };
    pet.setPointerCapture(e.pointerId);
    pet.dataset.dragging = 'true';
  });
  pet.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.startX;
    const dy = e.clientY - drag.startY;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    if (drag.moved) {
      pet.style.left = (drag.origLeft + dx) + 'px';
      pet.style.top = (drag.origTop + dy) + 'px';
    }
  });
  function endDrag() {
    if (!drag) return;
    const moved = drag.moved;
    drag = null;
    delete pet.dataset.dragging;
    if (moved) {
      suppressClick = true;
      const rect = pet.getBoundingClientRect();
      const maxX = Math.max(8, window.innerWidth - rect.width - 8);
      const maxY = Math.max(8, window.innerHeight - rect.height - 8);
      const x = Math.max(8, Math.min(maxX, rect.left));
      const y = Math.max(8, Math.min(maxY, rect.top));
      pet.style.left = x + 'px';
      pet.style.top = y + 'px';
      try { localStorage.setItem(POSITION_KEY, JSON.stringify({ x, y })); } catch { /* ignore */ }
      setTimeout(() => { suppressClick = false; }, 0);
    }
  }
  pet.addEventListener('pointerup', endDrag);
  pet.addEventListener('pointercancel', endDrag);

  const levelsEl = document.getElementById('levels');
  TIERS.forEach((tier, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = `${i + 1}`;
    b.title = tier.name;
    b.addEventListener('click', () => {
      level = i;
      document.querySelectorAll('#levels button').forEach((x, j) => x.classList.toggle('active', j === i));
      render();
    });
    levelsEl.appendChild(b);
  });
  document.querySelector('#levels button').classList.add('active');

  const statesEl = document.getElementById('states');
  STATES.forEach((s) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = STATE_LABELS[s];
    b.addEventListener('click', () => {
      document.querySelectorAll('#states button').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      setState(s, BUBBLES[s]);
      if (s === 'done') setTimeout(() => setState('idle', null), 3600);
    });
    statesEl.appendChild(b);
  });

  let autoRunning = false;
  document.getElementById('auto').addEventListener('click', () => {
    if (autoRunning) return;
    autoRunning = true;
    const script = [
      ['idle', null, 600],
      ['work', '干活中…', 2200],
      ['wait', '等你呢…', 1600],
      ['work', '干活中…', 2200],
      ['done', '搞定！', 1600],
      ['idle', null, 0],
    ];
    let at = 0;
    (function step() {
      if (at >= script.length) { autoRunning = false; return; }
      const [s, text, hold] = script[at++];
      setState(s, text);
      setTimeout(step, hold);
    })();
  });

  render();
</script>
</body>
</html>
